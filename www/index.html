}

function buildSegInto(boxId, items, current, onPick) {
  const box = $(boxId);
  box.innerHTML = "";
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = it.name;
    b.setAttribute("aria-pressed", String(it.id === current));
    b.onclick = () => onPick(it.id);
    box.appendChild(b);
  }
}

function setEarPlay(label, iconKind, disabled = false) {
  $("earPlayLabel").textContent = label;
  $("earPlayIcon").setAttribute("d", iconKind === "replay" ? "M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" : iconKind === "next" ? "M9 5l7 7-7 7" : "M7 4.5v15l13-7.5z");
  $("earPlayIcon").setAttribute("fill", iconKind === "next" ? "none" : "currentColor");
  $("earPlayIcon").setAttribute("stroke", iconKind === "next" ? "currentColor" : "none");
  $("earPlay").disabled = disabled;
}
function replayLabel() {
  if (!ear.exam) return setEarPlay(ES().listen, "replay");
  const left = CONS_PLAYS - ear.plays;
  setEarPlay(left > 0 ? CS().playsLeft(left) : CS().noPlays, "replay", left <= 0);
}

// ---------- Mikrofon ----------
async function earMicOn() {
  if (mic.on) return true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
    await mic.start();
    ear.ownMic = true;
    ensureLoop();
    return true;
  } catch (e) { return false; }
}
function earMicRelease() {
  if (ear.ownMic && mic.on && !$("mic").checked) mic.stop();
  ear.ownMic = false;
}

// ---------- Başlat / soru akışı ----------
async function earBegin() {
  const s = ES(), c = CS();
  piano.ensure();
  const cons = ear.section === "cons";
  let withSing = ear.isTest ? (cons ? true : ear.testMic) : needsMic(ear.type);
  if (withSing) {
    const ok = await earMicOn();
    if (!ok) {
      if (!ear.isTest || cons) { ear.notice = cons && ear.isTest ? (IS_IOS ? c.needMicExam : (MIC_ANY[state.lang] || MIC_ANY.en)[1]) : s.micFail; earRender(); return; }
      withSing = false;
      ear.notice = s.micSkip;
    }
  }
  ear.plan = ear.isTest ? (cons ? consExamPlan() : earTestPlan(withSing)) : Array.from({ length: EAR_QUESTIONS }, () => ({ type: ear.type, level: ear.level }));
  ear.idx = 0; ear.log = [];
  ear.view = "q";
  earRender();
  earNext();
}

function earNext() {
  earClearTimers();
  const s = ES(), c = CS();
  const step = ear.plan[ear.idx];
  const q = makeEarQuestion(step.type, step.level, Math.random, { voiceLo: Math.min(state.start, state.end), voiceHi: Math.max(state.start, state.end) });
  ear.q = q; ear.answered = false; ear.plays = 0;
  document.documentElement.style.setProperty("--ex", EAR_COLORS[q.type]);
  $("earProg").textContent = s.q(ear.idx + 1, ear.plan.length);
  $("earBarFill").style.width = `${(ear.idx / ear.plan.length) * 100}%`;
  $("earKicker").textContent = `${info(q.type).name} · ${S().levels[q.level]}`;
  $("earBig").textContent = "?";
  $("earFeedback").textContent = ear.notice || ""; $("earFeedback").className = "ear-fb"; ear.notice = null;
  const p = s.prompts, cp = c.prompts;
  $("earPrompt").textContent =
    q.type === "note" ? (q.level === "adv" ? p.noteAdv(nn(q.ref)) : p.note) :
    q.type === "interval" ? (q.harmonic ? p.intervalHarm : q.down ? p.intervalDown : p.interval) :
    q.type === "sing" ? p.sing(q.targets.length) :
    q.type === "c_two" || q.type === "c_three" ? cp[q.type](q.level === "easy") :
    q.type === "c_melody" ? cp.c_melody(q.targets.length) :
    isCons(q.type) ? cp[q.type] : p[q.type];
  const box = $("earAnswers");
  box.innerHTML = "";
  box.className = "answers" + (q.choices && q.choices.length > 6 ? " many" : "");
  $("earKeys").hidden = q.type !== "note";
  $("singRow").hidden = !isSingQ(q) && q.type !== "c_rhythm";
  $("earMeter").hidden = !isSingQ(q);
  $("tapPad").hidden = q.type !== "c_rhythm";
  $("tapPad").disabled = true;
  if (q.type === "note") buildEarKeys(q.lo, q.hi);
  else if (isSingQ(q)) buildChips(q.targets.length);
  else if (q.type === "c_rhythm") buildChips(q.onsets.length);
  else {
    for (const ch of q.choices) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ans"; b.dataset.v = String(ch);
      b.textContent = earLabel(q, ch);
      b.onclick = () => earAnswer(ch, b);
      box.appendChild(b);
    }
  }
  earPlayQ();
}

function earLabel(q, v) {
  const s = ES();
  if (q.type === "interval") return INTERVAL_NAMES[state.lang][v];
  if (q.type === "chord") return CHORD_NAMES[state.lang][v];
  if (q.type === "higher") return v === 1 ? s.first : s.second;
  if (q.type === "note") return NOTE_NAMES[state.lang][v];
  return String(v);
}

function earPlayQ() {
  const q = ear.q;
  if (ear.exam && ear.plays >= CONS_PLAYS) return;
  ear.plays++;
  const ctx = piano.ensure();
  piano.stopAll();
  earClearTimers();
  const t0 = ctx.currentTime + 0.12;
  for (const ev of q.play) for (const n of ev.notes) piano.play(n, t0 + ev.t, ev.dur, ev.vel);
  if (isSingQ(q)) { earSingStart(q, (q.len + 0.45) * 1000); return; }
  if (q.type === "c_rhythm") { earTapStart(q, (q.len + 0.2) * 1000); return; }
  if (!ear.answered) replayLabel();
}

function earAnswer(v, btn) {
  if (ear.answered) return;
  const q = ear.q, s = ES();
  const ok = checkEarAnswer(q, v);
  earRecord(ok, ok ? 1 : 0);
  if (q.type !== "note") {
    for (const b of $("earAnswers").children) {
      const bv = Number.isNaN(Number(b.dataset.v)) ? b.dataset.v : Number(b.dataset.v);
      if (bv === q.answer) b.classList.add("good");
      else if (b === btn) b.classList.add("bad");
      b.disabled = true;
    }
  }
  const right = q.type === "note" ? NOTE_NAMES[state.lang][q.answer] : earLabel(q, q.answer);
  $("earBig").textContent = ok ? "✓" : right;
  $("earFeedback").textContent = ok ? s.correct : s.wrong(right);
  $("earFeedback").className = "ear-fb " + (ok ? "ok" : "no");
}

function earRecord(ok, part, extra = {}) {
  ear.answered = true;
  ear.log.push({ type: ear.q.type, level: ear.q.level, ok, part, ...extra });
  $("earBarFill").style.width = `${((ear.idx + 1) / ear.plan.length) * 100}%`;
  const last = ear.idx >= ear.plan.length - 1;
  setEarPlay(last ? ES().results : ES().next, "next");
}
function examNeutral() {
  $("earBig").textContent = "✓";
  $("earFeedback").textContent = CS().recorded;
  $("earFeedback").className = "ear-fb";
}

$("earPlay").onclick = () => {
  if (ear.view === "result") { earOpen(ear.type, ear.isTest); return earBegin(); }
  if (ear.view === "setup") return earBegin();
  if (ear.view !== "q") return;
  if (!ear.answered) return earPlayQ();
  if (ear.idx < ear.plan.length - 1) { ear.idx++; earNext(); }
  else earFinish();
};

// ---------- Nota bulma klavyesi ----------
let earKeyEls = new Map();
function buildEarKeys(lo, hi) {
  const kb = $("earKeys");
  kb.innerHTML = ""; earKeyEls = new Map();
  kb.setAttribute("aria-label", S().keyboardLabel);
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const row = document.createElement("div"); row.className = "whites";
  const press = (m) => (e) => {
    e.preventDefault();
    const ctx = piano.ensure();
    piano.play(m, ctx.currentTime + 0.01, 0.6, 0.85);
    if (!ear.answered && ear.q && ear.q.type === "note") {
      const ok = checkEarAnswer(ear.q, m);
      earAnswer(m);
      for (const [km, el] of earKeyEls) if (pc(km) === ear.q.answer) el.classList.add("good");
      if (!ok) earKeyEls.get(m).classList.add("bad");
    } else {
      const el = earKeyEls.get(m); el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 500);
    }
  };
  for (const m of whites) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "key-w"; b.setAttribute("aria-label", nn(m));
    if (m % 12 === 0) b.textContent = nn(m);
    b.addEventListener("pointerdown", press(m));
    row.appendChild(b); earKeyEls.set(m, b);
  }
  kb.appendChild(row);
  const W = whites.length;
  for (let m = lo; m <= hi; m++) {
    if (!isBlack(m)) continue;
    const idx = whites.indexOf(m - 1);
    if (idx < 0) continue;
    const b = document.createElement("button");
    b.type = "button"; b.className = "key-b"; b.setAttribute("aria-label", nn(m));
    const bw = 62 / W;
    b.style.width = `${bw}%`; b.style.left = `${((idx + 1) / W) * 100 - bw / 2}%`;
    b.addEventListener("pointerdown", press(m));
    kb.appendChild(b); earKeyEls.set(m, b);
  }
}

// ---------- Söyleme soruları (Kulak + Konservatuvar) ----------
function buildChips(n) {
  $("singRow").innerHTML = Array.from({ length: n }, (_, i) => `<span class="chip" id="sc-${i}">${i + 1}</span>`).join("");
}
function chip(i) { return $(`sc-${i}`); }
function earSingStart(q, delayMs) {
  const s = ES();
  setEarPlay(s.listening, "replay", true);
  $("earBig").textContent = "♪";
  setLight(null, null, s.singGet);
  q.targets.forEach((_, i) => { const c = chip(i); if (c) { c.className = "chip"; delete c.dataset.done; } });
  ear.timers.push(setTimeout(() => {
    ear.sing = { q, i: 0, run: [], needChange: false, lastLocked: null, results: q.targets.map(() => null), noteStart: performance.now() / 1000, hits: 0 };
    $("earBig").textContent = q.targets.length > 1 ? s.singNote(1, q.targets.length) : s.singNow;
    setEarPlay(ear.exam ? (CONS_PLAYS - ear.plays > 0 ? CS().playsLeft(CONS_PLAYS - ear.plays) : CS().noPlays) : s.listen, "replay", ear.exam && CONS_PLAYS - ear.plays <= 0);
    earSingTick();
  }, delayMs));
}
// Işık: doğru tonda yeşil; değilse yön (yukarı/aşağı). Hedef notanın adı gösterilmez.
function setLight(midi, target, msg, hold = 0) {
  const s = ES(), el = $("earLight"), m = $("earMsg");
  el.classList.remove("ok", "low", "high", "on");
  el.style.setProperty("--p", `${Math.round(Math.min(1, hold) * 100)}%`);
  if (msg) { m.textContent = msg; el.querySelector("span").textContent = ""; return; }
  const st = pitchState(midi, target);
  if (st.state === "none") { m.textContent = s.singYourTurn; el.querySelector("span").textContent = ""; return; }
  el.classList.add("on", st.state);
  el.querySelector("span").textContent = st.state === "ok" ? "✓" : st.state === "low" ? "↑" : "↓";
  m.textContent = st.state === "ok" ? s.lightOk : st.state === "low" ? (st.far ? s.lightUpMore : s.lightUp) : (st.far ? s.lightDownMore : s.lightDown);
}
const HOLD_SEC = 0.75, NOTE_TIMEOUT = 10;
const median = (a) => { const b = a.slice().sort((x, y) => x - y); return b.length ? b[b.length >> 1] : null; };
function earSingTick() {
  const sg = ear.sing;
  if (!sg || sg.q !== ear.q) return;
  const s = ES();
  const now = performance.now() / 1000;
  const n = sg.q.targets.length, target = sg.q.targets[sg.i];
  for (let k = 0; k < n; k++) { const c = chip(k); if (c && !c.dataset.done) c.classList.toggle("now", k === sg.i); }
  // piyano çalarken (ya da sönerken) dinleme: kendi sesini duymasın
  const m = piano.voices.size > 0 ? null : mic.midi;
  if (now - sg.noteStart > NOTE_TIMEOUT) { earLockNote(sg.lastWrong ?? null); }
  else if (m == null) {
    sg.run = []; sg.needChange = false;
    setLight(null, target);
  } else {
    if (sg.needChange && Math.abs(m - sg.lastLocked) > 0.6) { sg.needChange = false; sg.run = []; }
    if (sg.needChange) setLight(null, null, s.singNext);
    else {
      if (sg.run.length && Math.abs(m - median(sg.run.map((r) => r.m))) > 0.5) sg.run = [];
      sg.run.push({ t: now, m });
      const held = now - sg.run[0].t;
      setLight(m, target, null, held / HOLD_SEC);
      if (held >= HOLD_SEC) {
        const med = median(sg.run.map((r) => r.m));
        // Alıştırmada yanlış ses kilitlenmez: ışık yön gösterir, doğru tutana kadar (ya da süre dolana kadar) dinler.
        if (ear.exam || Math.abs(centsOff(med, target)) <= TOLERANCE_CENTS) earLockNote(med);
        else sg.lastWrong = med;
      }
    }
  }
  if (!ear.sing) return;
  clearTimeout(ear.tick); ear.tick = setTimeout(earSingTick, 40);
}
function earLockNote(sung) {
  const sg = ear.sing, s = ES();
  const target = sg.q.targets[sg.i];
  const ok = sung != null && Math.abs(centsOff(sung, target)) <= TOLERANCE_CENTS;
  sg.results[sg.i] = { target, sung, ok };
  if (ok) sg.hits++;
  const c = chip(sg.i);
  if (c) { c.dataset.done = "1"; c.classList.remove("now"); c.classList.add(ear.exam ? "done" : ok ? "good" : "bad"); }
  sg.lastLocked = sung; sg.needChange = sung != null; sg.run = []; sg.lastWrong = null;
  sg.i++; sg.noteStart = performance.now() / 1000;
  if (sg.i >= sg.q.targets.length) return earSingEnd();
  $("earBig").textContent = s.singNote(sg.i + 1, sg.q.targets.length);
}
/** "Nerede kaldım": hedef ve söylenen notalar (sonradan gösterilir) */
function reviewHTML(results) {
  const s = ES();
  return `<div class="review">${results.map((r, i) => {
    const sung = r.sung == null ? `<em>${s.noVoice}</em>` : `${nn(Math.round(r.sung))} <small>${dirWord(r)}</small>`;
    return `<div class="rv ${r.ok ? "ok" : "no"}"><span class="rk">${results.length > 1 ? i + 1 + "." : ""}</span><span>${s.reviewTarget}: <b>${nn(r.target)}</b></span><span>${s.reviewYou}: <b>${sung}</b></span><span class="mk">${r.ok ? "✓" : "✗"}</span></div>`;
  }).join("")}</div>`;
}
function dirWord(r) {
  const s = ES();
  if (r.sung == null) return "";
  const c = Math.round(centsOff(r.sung, r.target));
  if (Math.abs(c) <= TOLERANCE_CENTS) return c === 0 ? "" : `(${c > 0 ? "+" : ""}${c} ${s.cents})`;
  return c < 0 ? s.wasLow : s.wasHigh;
}
function earSingEnd() {
  const sg = ear.sing; ear.sing = null;
  clearTimeout(ear.tick);
  const s = ES();
  const n = sg.q.targets.length;
  const ok = singPassed(sg.hits, n);
  earRecord(ok, sg.hits / n, { review: sg.results });
  setLight(null, null, " ");
  if (ear.exam) return examNeutral();
  $("earBig").textContent = ok ? "✓" : "✗";
  $("earFeedback").innerHTML = `<div>${ok ? s.correct + " " : ""}${s.singScore(sg.hits, n)}</div>${reviewHTML(sg.results)}`;
  $("earFeedback").className = "ear-fb " + (ok ? "ok" : "no");
}

// ---------- Ritim tekrarı ----------
function earTapStart(q, delayMs) {
  const s = ES(), c = CS();
  $("tapPad").textContent = c.tap;
  setEarPlay(s.listening, "replay", true);
  $("earBig").textContent = "♩";
  $("tapPad").disabled = true;
  $("tapPad").classList.remove("hit");
  q.onsets.forEach((_, i) => { const ch = chip(i); if (ch) { ch.className = "chip"; delete ch.dataset.done; } });
  ear.tap = null;
  ear.timers.push(setTimeout(() => {
    ear.tap = { q, taps: [] };
    $("earBig").textContent = c.tapNow;
    $("tapPad").disabled = false;
    if (ear.exam) replayLabel(); else setEarPlay(s.listen, "replay");
    clearTimeout(ear.tick); ear.tick = setTimeout(earTapEnd, 7000);
  }, delayMs));
}
function earTapHit(e) {
  e.preventDefault();
  const tp = ear.tap;
  if (!tp || ear.answered) return;
  const ctx = piano.ensure();
  piano.play(84, ctx.currentTime + 0.005, 0.1, 0.8);
  tp.taps.push(performance.now() / 1000);
  const pad = $("tapPad"); pad.classList.remove("hit"); void pad.offsetWidth; pad.classList.add("hit");
  const ch = chip(tp.taps.length - 1); if (ch) ch.classList.add("now");
  clearTimeout(ear.tick);
  if (tp.taps.length >= tp.q.onsets.length) { ear.tick = setTimeout(earTapEnd, 250); return; }
  ear.tick = setTimeout(earTapEnd, Math.max(2200, tp.q.beat * 3000));
}
function earTapEnd() {
  const tp = ear.tap; ear.tap = null;
  if (!tp || ear.answered || tp.q !== ear.q) return;
  $("tapPad").disabled = true;
  const q = tp.q, c = CS(), s = ES();
  const g = gradeRhythm(tp.taps, q.onsetsSec, q.tol);
  const n = q.onsets.length;
  earRecord(g.ok, g.hits / n);
  q.onsets.forEach((_, i) => {
    const ch = chip(i); if (!ch) return;
    ch.classList.remove("now");
    ch.classList.add(ear.exam ? "done" : g.errs.length === n && Math.abs(g.errs[i]) <= q.tol ? "good" : "bad");
  });
  if (ear.exam) return examNeutral();
  $("earBig").textContent = g.ok ? "✓" : "✗";
  $("earFeedback").textContent = tp.taps.length !== n ? c.rhythmCount(tp.taps.length, n) : `${g.ok ? s.correct + " " : ""}${c.rhythmScore(g.hits, n)}`;
  $("earFeedback").className = "ear-fb " + (g.ok ? "ok" : "no");
}
$("tapPad").addEventListener("pointerdown", earTapHit);

// ---------- Sonuç ----------
function earFinish() {
  earClearTimers();
  const s = ES(), c = CS();
  const box = $("earResult");
  if (ear.isTest && ear.section === "cons") {
    const sum = consExamSummary(ear.log);
    ear.data.consExam = { pct: sum.pct, at: Date.now() };
    earSave();
    const rows = Object.entries(sum.areas).map(([k, a]) => `<div class="area-row"><div class="area"><span>${c.areas[k]}</span><span class="pctv">%${a.pct}</span></div><div class="area-bar"><i style="width:${a.pct}%"></i></div></div>`).join("");
    const focusType = sum.weakest ? c.areaFocus[sum.weakest] : null;
    box.innerHTML = `<section class="stage res-stage">
        <div class="ear-kicker">${c.resultKicker}</div>
        <div class="res-big">%${sum.pct}</div>
        <div class="res-pct">${c.overall}</div>
      </section>
      <div class="panel areas">${rows}${sum.weakest ? `<p class="hint">${c.focus(c.areas[sum.weakest])}</p>` : ""}</div>
      ${ear.log.some((a) => a.review) ? `<div class="panel"><h3>${s.review}</h3>${ear.log.map((a, i) => a.review ? `<div class="rv-q"><div class="rv-h">${i + 1}. ${info(a.type).name}</div>${reviewHTML(a.review)}</div>` : "").join("")}</div>` : ""}
      <p class="note-hint">${c.disclaimer}</p>
      <div class="res-actions">
        ${focusType ? `<button type="button" class="ghost-btn" id="resFocus">${c.types[focusType].name} →</button>` : ""}
        <button type="button" class="ghost-btn" id="resHome">${c.back}</button></div>`;
    if (focusType) $("resFocus").onclick = () => earOpen(focusType, false);
  } else if (ear.isTest) {
    const sum = earTestSummary(ear.log);
    ear.data.test = { pct: sum.pct, rank: sum.rank, at: Date.now() };
    earSave();
    const rows = EAR_TYPES.filter((t) => sum.byType[t]).map((t) => {
      const r = sum.byType[t];
      return `<div class="area"><span>${s.types[t].name}</span><span class="dots">${"●".repeat(r.ok)}${"○".repeat(r.total - r.ok)}</span></div>`;
    }).join("");
    box.innerHTML = `<section class="stage res-stage">
        <div class="ear-kicker">${s.kulakLevel}</div>
        <div class="res-big">${s.ranks[sum.rank]}</div>
        <div class="res-pct">%${sum.pct}</div>
        <p class="res-text">${s.rankText[sum.rank]}</p>
      </section>
      <div class="panel areas">${rows}${sum.weakest ? `<p class="hint">${s.focus(s.types[sum.weakest].name)}</p>` : ""}</div>
      ${ear.log.some((a) => a.review) ? `<div class="panel"><h3>${s.review}</h3>${ear.log.map((a, i) => a.review ? `<div class="rv-q"><div class="rv-h">${i + 1}. ${info(a.type).name}</div>${reviewHTML(a.review)}</div>` : "").join("")}</div>` : ""}
      <div class="res-actions">
        ${sum.weakest ? `<button type="button" class="ghost-btn" id="resFocus">${s.types[sum.weakest].name} →</button>` : ""}
        <button type="button" class="ghost-btn" id="resHome">${s.home}</button></div>`;
    if (sum.weakest) $("resFocus").onclick = () => earOpen(sum.weakest, false);
  } else {
    const hits = ear.log.filter((a) => a.ok).length;
    const key = `${ear.type}-${ear.level}`;
    const prev = ear.data.best[key];
    const isBest = prev == null || hits > prev;
    if (isBest) { ear.data.best[key] = hits; earSave(); }
    box.innerHTML = `<section class="stage res-stage">
        <div class="ear-kicker">${info(ear.type).name} · ${S().levels[ear.level]}</div>
        <div class="res-big">${starsFor(hits, ear.log.length)}</div>
        <div class="res-pct">${s.score(hits, ear.log.length)}</div>
        ${isBest && prev != null ? `<p class="res-text">${s.newBest}</p>` : ""}
      </section>
      <div class="res-actions"><button type="button" class="ghost-btn" id="resHome">${ear.section === "cons" ? c.back : s.home}</button></div>`;
  }
  $("resHome").onclick = () => { ear.view = "home"; earRender(); window.scrollTo(0, 0); };
  earMicRelease();
  ear.view = "result";
  earRender();
  $("earBar").hidden = false;
  setEarPlay(s.again, "replay");
  window.scrollTo(0, 0);
}

function earClearTimers() { ear.timers.forEach(clearTimeout); clearTimeout(ear.tick); ear.timers = []; ear.sing = null; ear.tap = null; }
function earAbort() {
  earClearTimers();
  if (piano.ctx) piano.stopAll();
  earMicRelease();
  ear.view = "home";
}
$("earBack").onclick = () => { earAbort(); earRender(); window.scrollTo(0, 0); };

// Dil değişince bu sekmelerin metinleri de yenilensin
const _buildAll = buildAll;
buildAll = function () {
  _buildAll();
  if (state.tab !== "voice") showTab(state.tab);
};
document.addEventListener("visibilitychange", () => {
  if (document.hidden && ear.view === "q") { earClearTimers(); if (piano.ctx) piano.stopAll(); if (!ear.answered) { if (ear.exam) ear.plays = Math.max(0, ear.plays - 1); replayLabel(); } }
});

showTab(state.tab);
</script>
</body>
