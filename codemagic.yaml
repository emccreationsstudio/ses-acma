# Codemagic: Ses Açma iOS uygulamasını derler, imzalar ve App Store Connect'e (TestFlight) yükler.
# Mac gerekmez. Ayrıntılı adımlar: WINDOWS.md
#
# Değiştirmeniz gereken 2 şey:
#  1) bundle_identifier → capacitor.config.json içindeki appId ile AYNI olmalı
#  2) app_store_connect → Codemagic'te oluşturduğunuz API anahtarı entegrasyonunun adı

workflows:
  ios-appstore:
    name: Ses Açma — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SesAcma
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.emccreationsstudio.sesacma
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events: []   # yalnızca elle başlatılır ("Start new build")
    scripts:
      - name: Paketleri kur
        script: npm install
      - name: Testleri çalıştır
        script: npm test
      - name: Uygulama dosyasını derle
        script: npm run build
      - name: iOS projesini oluştur ve ayarla
        script: |
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          node scripts/ios-setup.js
          npx cap sync ios
      - name: Derleme numarasını artır
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: Uygulamayı paketle (.ipa)
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------------------------------------------------------------------------
  # Google Play: Android uygulama paketi (.aab). Ayrıntılar: KURULUM.md → Google Play
  android-playstore:
    name: Ses Açma — Google Play
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - sesacma_upload        # Codemagic > Code signing identities > Android keystores'taki referans adı
      node: 22
      java: 21
    triggering:
      events: []   # yalnızca elle başlatılır ("Start new build")
    scripts:
      - name: Paketleri kur
        script: npm install
      - name: Testleri çalıştır
        script: npm test
      - name: Uygulama dosyasını derle
        script: npm run build
      - name: Android projesini oluştur ve ayarla
        script: |
          rm -rf android
          npx cap add android
          node scripts/android-setup.js
          npx cap sync android
      - name: Google Play paketini derle (.aab)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    # İlk .aab'yi Play Console'a elle yükledikten sonra otomatik yükleme için:
    # Play Console'da hizmet hesabı (service account) oluşturup JSON'unu Codemagic'te
    # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS adlı gizli değişken olarak ekleyin ve aşağıyı açın.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
